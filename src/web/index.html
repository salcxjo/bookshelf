<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bookshelf</title>
<style>
  :root {
    --bg: #faf8f5; --card: #ffffff; --text: #1f1d1a; --muted: #6f6a62;
    --line: #e7e2da; --accent: #2d5a4a; --on-accent: #ffffff; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181a; --card: #202326; --text: #ece9e4; --muted: #9a958d;
      --line: #2f3337; --accent: #6fbf9f; --on-accent: #10201a; --danger: #f2a199;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: max(12px, env(safe-area-inset-top)) 16px 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  h1 { font-size: 1.25rem; margin: 0; }
  .actions { display: flex; gap: 8px; }
  .btn {
    display: inline-block; font: inherit; font-weight: 600; font-size: .95rem;
    padding: 9px 16px; border-radius: 999px; cursor: pointer; user-select: none;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.busy, .btn:disabled { opacity: .6; pointer-events: none; }
  nav { display: flex; gap: 8px; padding: 12px 16px 0; overflow-x: auto; }
  nav button {
    flex: none; font: inherit; font-size: .9rem; padding: 6px 14px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--card); color: var(--text);
  }
  nav button.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  main {
    padding: 16px; display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .cover { position: relative; aspect-ratio: 2 / 3; background: var(--line); }
  .cover img, .cover .ph, .detail-cover img, .detail-cover .ph { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cover img, .detail-cover img { object-fit: cover; }
  .cover .ph, .detail-cover .ph {
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 12px; color: var(--muted); font-weight: 600;
  }
  .info { padding: 10px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .title { font-weight: 600; line-height: 1.25; }
  .title-btn {
    background: none; border: 0; padding: 0; font: inherit; font-weight: 600; line-height: 1.25;
    color: inherit; text-align: start; cursor: pointer; overflow-wrap: anywhere;
  }
  .title-btn:hover { text-decoration: underline; }
  .cover.clickable { cursor: pointer; }
  .badge {
    align-self: flex-start; font-size: .7rem; padding: 1px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted);
  }
  .meta { color: var(--muted); font-size: .85rem; }
  select {
    width: 100%; padding: 6px; font: inherit; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  .stars button {
    background: none; border: 0; padding: 0 2px; font-size: 1.3rem;
    cursor: pointer; color: var(--line);
  }
  .stars button.on { color: #e0a100; }
  .del {
    margin-top: auto; background: none; border: 0; padding: 0; text-align: left;
    font: inherit; font-size: .8rem; color: var(--danger); cursor: pointer;
  }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 48px 0; }
  #toast {
    position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom));
    transform: translateX(-50%); max-width: 90vw; padding: 10px 16px;
    border-radius: 10px; background: var(--text); color: var(--bg);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  #toast.show { opacity: 1; }
  #toast.error { background: var(--danger); color: var(--bg); }

  /* search, sort and filters */
  .toolbar { display: flex; gap: 8px; padding: 12px 16px 0; }
  .toolbar input[type="search"] { flex: 1; min-width: 0; }
  .toolbar select { width: auto; max-width: 45%; }
  input[type="search"], input[type="number"] {
    padding: 8px 10px; font: inherit; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  .filters { padding: 8px 16px 0; }
  .filters summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
  .filter-row { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; padding: 10px 0 0; }
  .filter-row label { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--muted); }
  .filter-row input[type="number"] { width: 6.5rem; }
  .filter-row select { width: auto; }
  .result-info { margin: 0; padding: 8px 16px 0; }
  .result-info:empty { display: none; }
  .link {
    background: none; border: 0; padding: 0; font: inherit; color: inherit;
    text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 2px;
    cursor: pointer;
  }
  .link:hover { text-decoration-color: currentColor; }

  /* book detail dialog */
  dialog.detail { width: min(94vw, 640px); }
  .detail-head { display: flex; gap: 14px; }
  .detail-cover {
    position: relative; flex: none; width: 110px; aspect-ratio: 2 / 3;
    background: var(--line); border-radius: 8px; overflow: hidden;
  }
  .detail-main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .detail-main h2 { margin: 0; font-size: 1.2rem; overflow-wrap: anywhere; }
  .detail h3 {
    margin: 18px 0 6px; font-size: .8rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
  }
  .synopsis { margin: 0; white-space: pre-line; }
  .check { display: flex; align-items: center; gap: 8px; }
  textarea, .edit-form input[type="text"], .edit-form input[type="url"], .edit-form input[type="number"] {
    width: 100%; padding: 8px 10px; font: inherit; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  .edit-form { display: grid; gap: 10px; margin-top: 10px; }
  .edit-form label { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--muted); }
  details summary { cursor: pointer; margin-top: 14px; }
  .detail-actions { justify-content: space-between; margin-top: 16px; }
  .btn.danger { color: var(--danger); }

  /* add a book */
  .tabs-inline { display: flex; gap: 8px; margin: 14px 0 4px; }
  .add-options { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 10px 0; font-size: .9rem; color: var(--muted); }
  .add-options select { width: auto; margin-left: 6px; }
  .search-row { display: flex; gap: 8px; margin-top: 8px; }
  .search-row input { flex: 1; min-width: 0; }
  .results { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 12px; max-height: 45vh; overflow-y: auto; }
  .result { display: flex; align-items: center; gap: 12px; }
  .result .thumb { position: relative; flex: none; width: 44px; aspect-ratio: 2 / 3; background: var(--line); border-radius: 4px; overflow: hidden; }
  .result .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .result .text { flex: 1; min-width: 0; }
  .result .t { font-weight: 600; overflow-wrap: anywhere; }
  .result .action { flex: none; }
  @media (max-width: 440px) {
    header { flex-wrap: wrap; }
    .btn { padding: 8px 13px; }
  }

  /* batch import dialog */
  dialog {
    width: min(92vw, 520px); max-height: 88vh; padding: 16px; overflow-y: auto;
    border: 1px solid var(--line); border-radius: 14px;
    background: var(--card); color: var(--text);
  }
  dialog::backdrop { background: rgba(0, 0, 0, .5); }
  dialog h2 { margin: 0 0 4px; font-size: 1.1rem; }
  .field { display: block; margin: 12px 0; font-size: .9rem; color: var(--muted); }
  .field select { margin-top: 4px; }
  progress { width: 100%; height: 8px; accent-color: var(--accent); }
  #importList {
    list-style: none; margin: 12px 0; padding: 0; max-height: 40vh; overflow-y: auto;
    border-top: 1px solid var(--line);
  }
  #importList li {
    display: flex; justify-content: space-between; gap: 12px; padding: 6px 0;
    border-bottom: 1px solid var(--line); font-size: .9rem;
  }
  #importList .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #importList .result { color: var(--muted); text-align: right; }
  #importList li.added .result { color: var(--accent); }
  #importList li.failed .result { color: var(--danger); }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
</style>
</head>
<body>
<header>
  <h1>Bookshelf</h1>
  <div class="actions">
    <label class="btn primary" id="scanBtn">
      <span id="scanLabel">Scan</span>
      <input id="file" type="file" accept="image/*" capture="environment" hidden>
    </label>
    <label class="btn" id="importBtn">
      Import
      <input id="files" type="file" accept="image/*" multiple hidden>
    </label>
    <button class="btn" id="addBtn" type="button">Add</button>
  </div>
</header>
<section class="toolbar">
  <input id="search" type="search" placeholder="Search title, author, year…" aria-label="Search" autocomplete="off" enterkeyhint="search">
  <select id="sort" aria-label="Sort by">
    <option value="added">Recently added</option>
    <option value="title">Title A–Z</option>
    <option value="author">Author A–Z</option>
    <option value="year-desc">Year, newest</option>
    <option value="year-asc">Year, oldest</option>
    <option value="rating">Highest rated</option>
    <option value="finished">Recently finished</option>
  </select>
</section>
<details class="filters" id="filters">
  <summary id="filtersSummary">Filters</summary>
  <div class="filter-row">
    <label>Min rating
      <select id="minRating">
        <option value="0">Any</option>
        <option value="1">★ 1+</option>
        <option value="2">★ 2+</option>
        <option value="3">★ 3+</option>
        <option value="4">★ 4+</option>
        <option value="5">★ 5</option>
      </select>
    </label>
    <label>Year from <input id="yearFrom" type="number" inputmode="numeric" min="0" max="2100"></label>
    <label>Year to <input id="yearTo" type="number" inputmode="numeric" min="0" max="2100"></label>
    <button class="btn" id="clearFilters" type="button">Clear</button>
  </div>
</details>
<nav id="tabs"></nav>
<p class="meta result-info" id="resultInfo"></p>
<main id="grid"></main>
<div id="toast" role="status" aria-live="polite"></div>

<dialog id="detailDialog" class="detail" aria-labelledby="detailTitle">
  <div class="detail-head">
    <div class="detail-cover" id="detailCover"></div>
    <div class="detail-main">
      <h2 id="detailTitle" dir="auto"></h2>
      <div class="meta" id="detailMeta"></div>
      <div id="detailControls" class="detail-main"></div>
    </div>
  </div>
  <h3>Synopsis</h3>
  <p class="synopsis" id="detailSynopsis" dir="auto"></p>
  <button class="link meta" id="synopsisRefresh" type="button" hidden>Look again</button>
  <h3>Notes</h3>
  <textarea id="detailNotes" rows="4" maxlength="5000" placeholder="Your notes about this book"></textarea>
  <details id="editBox">
    <summary class="meta">Edit details</summary>
    <form class="edit-form" id="editForm">
      <label>Title <input id="editTitle" type="text" required maxlength="300"></label>
      <label>Subtitle <input id="editSubtitle" type="text" maxlength="300"></label>
      <label>Authors (one per line) <textarea id="editAuthors" rows="3"></textarea></label>
      <label>Publisher <input id="editPublisher" type="text" maxlength="300"></label>
      <label>Year <input id="editYear" type="number" inputmode="numeric" min="0" max="2100"></label>
      <label>Cover image URL <input id="editCover" type="url" maxlength="1000" placeholder="https://…"></label>
      <button class="btn primary" type="submit">Save details</button>
    </form>
  </details>
  <div class="dialog-actions detail-actions">
    <button class="btn danger" id="detailRemove" type="button">Remove</button>
    <button class="btn" id="detailClose" type="button">Close</button>
  </div>
</dialog>

<dialog id="addDialog" class="detail" aria-labelledby="addTitle">
  <h2 id="addTitle">Add a book</h2>
  <div class="tabs-inline">
    <button class="btn primary" id="addTabSearch" type="button">Search</button>
    <button class="btn" id="addTabManual" type="button">Enter by hand</button>
  </div>
  <div class="add-options">
    <label>Shelf
      <select id="addShelf">
        <option value="want">Want to read</option>
        <option value="reading">Reading</option>
        <option value="read">Read</option>
      </select>
    </label>
    <label class="check"><input id="addOwned" type="checkbox" checked> I own this book</label>
  </div>

  <section id="addSearchPane">
    <form id="searchForm" class="search-row">
      <input id="addQuery" type="search" placeholder="Title, author or ISBN" aria-label="Search for a book" autocomplete="off" enterkeyhint="search">
      <button class="btn primary" type="submit">Search</button>
    </form>
    <p class="meta" id="addHint"></p>
    <ul class="results" id="addResults"></ul>
  </section>

  <section id="addManualPane" hidden>
    <form class="edit-form" id="manualForm">
      <label>Title <input id="manualTitle" type="text" required maxlength="300"></label>
      <label>Authors (one per line) <textarea id="manualAuthors" rows="2"></textarea></label>
      <label>Subtitle <input id="manualSubtitle" type="text" maxlength="300"></label>
      <label>Publisher <input id="manualPublisher" type="text" maxlength="300"></label>
      <label>Year <input id="manualYear" type="number" inputmode="numeric" min="0" max="2100"></label>
      <label>ISBN (optional) <input id="manualIsbn" type="text" inputmode="numeric" maxlength="32"></label>
      <label>Cover image URL (optional) <input id="manualCover" type="url" maxlength="1000" placeholder="https://…"></label>
      <button class="btn primary" type="submit">Add book</button>
    </form>
  </section>

  <div class="dialog-actions">
    <button class="btn" id="addClose" type="button">Close</button>
  </div>
</dialog>

<dialog id="importDialog" aria-labelledby="importTitle">
  <h2 id="importTitle">Import photos</h2>
  <p id="importSummary" class="meta"></p>
  <label class="field">Add to shelf
    <select id="importShelf">
      <option value="want">Want to read</option>
      <option value="reading">Reading</option>
      <option value="read">Read</option>
    </select>
  </label>
  <progress id="importProgress" max="1" value="0"></progress>
  <ul id="importList"></ul>
  <div class="dialog-actions">
    <button class="btn" id="importClose" type="button">Close</button>
    <button class="btn" id="importRetry" type="button" hidden>Retry failed</button>
    <button class="btn primary" id="importStart" type="button">Start import</button>
  </div>
</dialog>

<script>
const TABS = [["all", "All"], ["want", "Want to read"], ["reading", "Reading"], ["read", "Read"]];
const STATUS_LABELS = { want: "Want to read", reading: "Reading", read: "Read" };
const SCAN_ERRORS = {
  400: "That file isn’t a readable image.",
  409: "Already in your library.",
  413: "That photo is too large.",
  422: "No barcode found. Try a closer, sharper photo of the back cover.",
  502: "Open Library couldn’t be reached. Try again in a moment.",
};
const MAX_EDGE = 2400;   // batch import shrinks photos so their longest side is at most this many px
const CONCURRENCY = 2;   // how many batch photos are scanned at the same time

let books = [];
const VIEW_KEY = "bookshelf.view";
const DEFAULT_VIEW = { tab: "all", q: "", sort: "added", minRating: 0, yearFrom: "", yearTo: "" };

function loadView() {
  try {
    return { ...DEFAULT_VIEW, ...JSON.parse(localStorage.getItem(VIEW_KEY) ?? "{}") };
  } catch {
    return { ...DEFAULT_VIEW };
  }
}
function saveView() {
  try { localStorage.setItem(VIEW_KEY, JSON.stringify(view)); } catch { /* storage unavailable */ }
}

let view = loadView();

// Case-, accent- and punctuation-insensitive text for searching. The three replaces
// make Arabic and Persian spellings of ی / ک match, and ignore the zero-width joiner.
const norm = (s) => String(s ?? "")
  .normalize("NFD").replace(/\p{M}/gu, "")
  .replace(/ي/g, "ی").replace(/ك/g, "ک").replace(/\u200c/g, "")
  .toLowerCase();

const collator = new Intl.Collator(undefined, { sensitivity: "base", numeric: true });

// Missing values (no year, no rating...) always sort last, whichever direction is chosen.
function compareBy(get, { desc = false, text = false } = {}) {
  return (a, b) => {
    const x = get(a), y = get(b);
    if (x == null && y == null) return 0;
    if (x == null) return 1;
    if (y == null) return -1;
    const result = text ? collator.compare(x, y) : x < y ? -1 : x > y ? 1 : 0;
    return desc ? -result : result;
  };
}

// "added" has no sorter: the server already returns newest first, and sort() is stable,
// so every other sort breaks ties in that order.
const SORTERS = {
  added: null,
  title: compareBy((b) => b.title, { text: true }),
  author: compareBy((b) => b.authors[0], { text: true }),
  "year-desc": compareBy((b) => b.year, { desc: true }),
  "year-asc": compareBy((b) => b.year),
  rating: compareBy((b) => b.rating, { desc: true }),
  finished: compareBy((b) => b.finished_on, { desc: true }),
};

function activeFilterCount() {
  return (view.minRating > 0) + Boolean(view.yearFrom) + Boolean(view.yearTo);
}

// Every book matching the search box and filters, on any shelf.
function matchingBooks() {
  const tokens = norm(view.q).split(/\s+/).filter(Boolean);
  const from = parseInt(view.yearFrom, 10);
  const to = parseInt(view.yearTo, 10);
  return books.filter((b) => {
    if ((b.rating ?? 0) < view.minRating) return false;
    if (!Number.isNaN(from) && !(b.year != null && b.year >= from)) return false;
    if (!Number.isNaN(to) && !(b.year != null && b.year <= to)) return false;
    if (tokens.length) {
      b._hay ??= norm([b.title, b.subtitle, b.authors.join(" "), b.publisher, b.year].join(" "));
      if (!tokens.every((t) => b._hay.includes(t))) return false;
    }
    return true;
  });
}

const $ = (selector) => document.querySelector(selector);

// Builds DOM nodes without innerHTML, so titles from the API can never inject markup.
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value);
  }
  node.append(...children);
  return node;
}

let toastTimer;
function toast(message, isError = false) {
  const t = $("#toast");
  t.textContent = message;
  t.className = isError ? "show error" : "show";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ""; }, 4500);
}

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail ?? detail; } catch { /* no JSON body */ }
    const message = Array.isArray(detail) ? detail.map((d) => d.msg ?? JSON.stringify(d)).join("; ")
      : typeof detail === "string" ? detail : JSON.stringify(detail);
    const err = new Error(message);
    err.status = res.status;
    err.detail = detail; // the raw value, for structured errors such as duplicate warnings
    throw err;
  }
  return res.status === 204 ? null : res.json();
}

async function load() {
  books = await api("/books");
  render();
}

async function patch(book, changes, message) {
  let ok = false;
  try {
    const updated = await api(`/books/${book.id}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(changes),
    });
    books = books.map((b) => (b.id === updated.id ? updated : b));
    ok = true;
    if (message) toast(message);
  } catch (err) {
    toast(err.message, true);
  }
  render(); // also resets a dropdown whose change failed
  if (detailId === book.id) renderDetail();
  return ok;
}

async function remove(book) {
  if (!confirm(`Remove “${book.title}” from your library?`)) return;
  try {
    await api(`/books/${book.id}`, { method: "DELETE" });
    books = books.filter((b) => b.id !== book.id);
    if (detailId === book.id) $("#detailDialog").close();
  } catch (err) {
    toast(err.message, true);
  }
  render();
}

function metaLine(book) {
  const line = el("div", { class: "meta" });
  book.authors.forEach((name, i) => {
    if (i) line.append(", ");
    line.append(el("button", {
      class: "link", dir: "auto", text: name, title: `Search for ${name}`,
      onclick: () => applySearch(name),
    }));
  });
  if (book.year) line.append((book.authors.length ? " · " : "") + book.year);
  return line;
}

function coverNode(book, className) {
  const cover = el("div", { class: className }, el("span", { class: "ph", dir: "auto", text: book.title }));
  if (book.cover_url) {
    const img = el("img", { src: book.cover_url, alt: "", loading: "lazy", referrerpolicy: "no-referrer" });
    img.addEventListener("error", () => img.remove()); // falls back to the title placeholder
    cover.append(img);
  }
  return cover;
}

function statusSelect(book) {
  const select = el("select", { "aria-label": `Status for ${book.title}` },
    ...Object.entries(STATUS_LABELS).map(([value, label]) => el("option", { value, text: label })));
  select.value = book.status ?? "want";
  select.addEventListener("change", () => patch(book, { status: select.value }));
  return select;
}

function ratingStars(book) {
  const stars = el("div", { class: "stars", role: "group", "aria-label": "Rating" });
  for (let i = 1; i <= 5; i++) {
    stars.append(el("button", {
      class: i <= (book.rating ?? 0) ? "on" : "",
      "aria-label": `${i} star${i > 1 ? "s" : ""}`,
      text: "★",
      onclick: () => patch(book, { rating: book.rating === i ? null : i }), // tap again to clear
    }));
  }
  return stars;
}

function datesLine(book) {
  if (book.finished_on) return el("div", { class: "meta", text: `Finished ${book.finished_on}` });
  if (book.started_on) return el("div", { class: "meta", text: `Started ${book.started_on}` });
  return null;
}

function card(book) {
  const cover = coverNode(book, "cover clickable");
  cover.addEventListener("click", () => openDetail(book.id));

  const info = el("div", { class: "info" },
    el("button", { class: "title title-btn", dir: "auto", text: book.title, onclick: () => openDetail(book.id) }),
    metaLine(book),
    statusSelect(book));
  const dates = datesLine(book);
  if (dates) info.append(dates);
  if (!book.owned) info.append(el("span", { class: "badge", text: "Wishlist" }));
  if (book.status === "read") info.append(ratingStars(book));
  info.append(el("button", { class: "del", text: "Remove", onclick: () => remove(book) }));
  return el("article", { class: "card" }, cover, info);
}

// ---------------------------------------------------------------- book detail

let detailId = null;
const currentDetail = () => books.find((b) => b.id === detailId);

function fillEditForm(book) {
  $("#editTitle").value = book.title;
  $("#editSubtitle").value = book.subtitle ?? "";
  $("#editAuthors").value = book.authors.join("\n");
  $("#editPublisher").value = book.publisher ?? "";
  $("#editYear").value = book.year ?? "";
  $("#editCover").value = book.cover_url ?? "";
}

function renderDetail() {
  const book = currentDetail();
  if (!book) return;

  $("#detailCover").replaceWith(Object.assign(coverNode(book, "detail-cover"), { id: "detailCover" }));
  $("#detailTitle").textContent = book.title;

  const meta = $("#detailMeta");
  meta.replaceChildren();
  if (book.subtitle) meta.append(el("div", { dir: "auto", text: book.subtitle }));
  meta.append(metaLine(book));
  const extra = [book.publisher, book.isbn && `ISBN ${book.isbn}`].filter(Boolean).join(" · ");
  if (extra) meta.append(el("div", { dir: "auto", text: extra }));

  const owned = el("input", { type: "checkbox" });
  owned.checked = book.owned;
  owned.addEventListener("change", () => patch(book, { owned: owned.checked }));
  const controls = [statusSelect(book)];
  if (book.status === "read") controls.push(ratingStars(book));
  const dates = datesLine(book);
  if (dates) controls.push(dates);
  controls.push(el("label", { class: "check meta" }, owned, "I own this book"));
  $("#detailControls").replaceChildren(...controls);

  const notes = $("#detailNotes");
  if (document.activeElement !== notes) notes.value = book.notes ?? "";
}

async function loadSynopsis(refresh) {
  const id = detailId;
  const box = $("#detailSynopsis");
  box.textContent = "Loading…";
  $("#synopsisRefresh").hidden = true;
  try {
    const data = await api(`/books/${id}/synopsis${refresh ? "?refresh=true" : ""}`);
    if (id !== detailId) return; // another book was opened meanwhile
    box.textContent = data.description || "No synopsis available for this book.";
  } catch (err) {
    if (id !== detailId) return;
    box.textContent = `Couldn’t load the synopsis (${err.message}).`;
  }
  $("#synopsisRefresh").hidden = false;
}

function openDetail(id) {
  const book = books.find((b) => b.id === id);
  if (!book) return;
  detailId = id;
  $("#editBox").open = false;
  fillEditForm(book);
  $("#detailNotes").value = book.notes ?? "";
  renderDetail();
  loadSynopsis(false);
  const dialog = $("#detailDialog");
  if (!dialog.hasAttribute("open")) dialog.showModal();
}

async function saveNotes(book, text) {
  if (!book) return;
  text = text.trim();
  if (text === (book.notes ?? "")) return;
  await patch(book, { notes: text }, "Notes saved");
}

$("#detailNotes").addEventListener("blur", () => saveNotes(currentDetail(), $("#detailNotes").value));
$("#synopsisRefresh").addEventListener("click", () => loadSynopsis(true));
$("#detailClose").addEventListener("click", () => $("#detailDialog").close());
$("#detailRemove").addEventListener("click", () => { const b = currentDetail(); if (b) remove(b); });
$("#detailDialog").addEventListener("close", () => {
  // Closing with Esc doesn't always blur the textarea first, so save here. Capture the book and
  // text before anything else happens: another book may be opened before the save finishes.
  const book = currentDetail();
  const text = $("#detailNotes").value;
  detailId = null;
  saveNotes(book, text);
});
$("#editForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  const book = currentDetail();
  if (!book) return;
  const year = $("#editYear").value.trim();
  const ok = await patch(book, {
    title: $("#editTitle").value.trim(),
    subtitle: $("#editSubtitle").value.trim() || null,
    authors: $("#editAuthors").value.split("\n").map((s) => s.trim()).filter(Boolean),
    publisher: $("#editPublisher").value.trim() || null,
    year: year === "" ? null : Number(year),
    cover_url: $("#editCover").value.trim() || null,
  }, "Details saved");
  if (ok) { fillEditForm(currentDetail()); $("#editBox").open = false; }
});

function render() {
  if (!TABS.some(([key]) => key === view.tab)) view.tab = "all";
  const matching = matchingBooks();

  // Tab counts reflect the current search and filters
  $("#tabs").replaceChildren(...TABS.map(([key, label]) => {
    const count = key === "all" ? matching.length : matching.filter((b) => b.status === key).length;
    return el("button", {
      class: key === view.tab ? "active" : "",
      text: `${label} (${count})`,
      onclick: () => { view.tab = key; saveView(); render(); },
    });
  }));

  const shown = view.tab === "all" ? matching.slice() : matching.filter((b) => b.status === view.tab);
  const sorter = SORTERS[view.sort];
  if (sorter) shown.sort(sorter);

  const filtering = Boolean(norm(view.q).trim()) || activeFilterCount() > 0;
  $("#resultInfo").textContent = filtering ? `${shown.length} of ${books.length} books` : "";
  const n = activeFilterCount();
  $("#filtersSummary").textContent = n ? `Filters (${n})` : "Filters";

  const empty = !books.length
    ? "No books yet. Tap “Scan”, “Import” or “Add” to add your first."
    : filtering ? "No books match your search or filters." : "Nothing on this shelf yet.";
  $("#grid").replaceChildren(...(shown.length ? shown.map(card) : [el("p", { class: "empty", text: empty })]));
}

// ---------------------------------------------------------------- single scan (camera)

$("#file").addEventListener("change", async (event) => {
  const file = event.target.files[0];
  event.target.value = ""; // lets the same photo be chosen again
  if (!file) return;

  const form = new FormData();
  form.append("file", file);
  const shelf = view.tab === "all" ? "want" : view.tab; // scan straight onto the shelf you're viewing

  $("#scanBtn").classList.add("busy");
  $("#scanLabel").textContent = "Scanning…";
  try {
    const book = await api(`/scan?shelf_status=${shelf}`, { method: "POST", body: form });
    const alreadyThere = books.some((b) => b.id === book.id);
    await load();
    toast(alreadyThere ? `Already in your library: ${book.title}` : `Added: ${book.title}`);
  } catch (err) {
    toast(SCAN_ERRORS[err.status] ?? err.message, true);
  } finally {
    $("#scanBtn").classList.remove("busy");
    $("#scanLabel").textContent = "Scan";
  }
});

// ---------------------------------------------------------------- batch import (gallery)

const importState = { items: [], running: false };

// Shrinks big phone photos before upload so a batch of 20 doesn't mean 150 MB of traffic.
// If the browser can't decode the file, it is sent unchanged and the server decides.
async function downscale(file) {
  try {
    const bitmap = await createImageBitmap(file);
    const scale = Math.min(1, MAX_EDGE / Math.max(bitmap.width, bitmap.height));
    if (scale === 1) { bitmap.close(); return file; }
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(bitmap.width * scale);
    canvas.height = Math.round(bitmap.height * scale);
    canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    bitmap.close();
    return (await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.92))) ?? file;
  } catch {
    return file;
  }
}

async function runQueue(items, worker, concurrency) {
  let next = 0;
  await Promise.all(Array.from({ length: concurrency }, async () => {
    while (next < items.length) await worker(items[next++]);
  }));
}

function describeItem(item) {
  if (item.state === "pending") return "Waiting";
  if (item.state === "working") return "Scanning…";
  return item.message;
}

function renderImport() {
  const { items, running } = importState;
  const count = (state) => items.filter((it) => it.state === state).length;
  const done = items.length - count("pending") - count("working");
  const started = items.some((it) => it.state !== "pending");
  const finished = started && !running && count("pending") === 0;

  for (const it of items) {
    it.row.className = it.state;
    it.result.textContent = describeItem(it);
  }
  $("#importProgress").value = items.length ? done / items.length : 0;
  $("#importSummary").textContent = finished
    ? `${count("added")} added · ${count("existing")} already in library · ${count("failed")} failed`
    : running
      ? `${done} of ${items.length} done…`
      : `${items.length} photo${items.length === 1 ? "" : "s"} selected`;

  $("#importShelf").disabled = started;
  $("#importStart").hidden = started;
  $("#importRetry").hidden = !(finished && count("failed") > 0);
  $("#importClose").disabled = running;
}

function openImport(files) {
  importState.items = files.map((file) => {
    const result = el("span", { class: "result" });
    const row = el("li", {}, el("span", { class: "name", text: file.name }), result);
    return { file, state: "pending", message: "", row, result };
  });
  importState.running = false;
  $("#importList").replaceChildren(...importState.items.map((it) => it.row));
  $("#importShelf").value = view.tab === "all" ? "want" : view.tab;
  renderImport();
  $("#importDialog").showModal();
}

async function startImport(onlyFailed) {
  if (importState.running) return;
  const targets = importState.items.filter((it) => (onlyFailed ? it.state === "failed" : it.state === "pending"));
  if (!targets.length) return;

  const shelf = $("#importShelf").value;
  const knownIds = new Set(books.map((b) => b.id)); // tells "added" apart from "already had it"
  targets.forEach((it) => { it.state = "pending"; it.message = ""; });
  importState.running = true;
  renderImport();

  await runQueue(targets, async (item) => {
    item.state = "working";
    renderImport();
    try {
      const upload = await downscale(item.file);
      const form = new FormData();
      form.append("file", upload, item.file.name);
      const book = await api(`/scan?shelf_status=${shelf}`, { method: "POST", body: form });
      if (knownIds.has(book.id)) {
        item.state = "existing";
        item.message = `Already have: ${book.title}`;
      } else {
        knownIds.add(book.id);
        item.state = "added";
        item.message = `Added: ${book.title}`;
      }
    } catch (err) {
      if (err.status === 409) { // two photos of the same new book raced each other
        item.state = "existing";
        item.message = "Already added";
      } else {
        item.state = "failed";
        item.message = SCAN_ERRORS[err.status] ?? err.message;
      }
    }
    renderImport();
  }, CONCURRENCY);

  importState.running = false;
  renderImport();
  try { await load(); } catch (err) { toast(err.message, true); }
}

$("#files").addEventListener("change", (event) => {
  const files = [...event.target.files];
  event.target.value = "";
  if (files.length) openImport(files);
});
$("#importStart").addEventListener("click", () => startImport(false));
$("#importRetry").addEventListener("click", () => startImport(true));
$("#importClose").addEventListener("click", () => $("#importDialog").close());
$("#importDialog").addEventListener("cancel", (event) => {
  if (importState.running) event.preventDefault(); // Esc shouldn't abandon a running import
});

// ---------------------------------------------------------------- add a book (search or by hand)

function setAddTab(name) {
  const search = name === "search";
  $("#addSearchPane").hidden = !search;
  $("#addManualPane").hidden = search;
  $("#addTabSearch").classList.toggle("primary", search);
  $("#addTabManual").classList.toggle("primary", !search);
}

function openAdd() {
  $("#addShelf").value = view.tab === "all" ? "want" : view.tab;
  $("#addOwned").checked = true;
  setAddTab("search");
  const dialog = $("#addDialog");
  if (!dialog.hasAttribute("open")) dialog.showModal();
  $("#addQuery").focus();
}

// POST /books. Returns the stored book, or null when nothing was added (the reason is toasted).
async function postBook(payload, source, force = false) {
  const body = { ...payload, source, force, status: $("#addShelf").value, owned: $("#addOwned").checked };
  try {
    return await api("/books", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
  } catch (err) {
    const info = err.status === 409 && err.detail && typeof err.detail === "object" ? err.detail : null;
    if (info && info.can_force && !force && confirm(`You already have “${info.book.title}”. Add this one anyway?`)) {
      return postBook(payload, source, true);
    }
    toast(info ? info.message : err.message, true);
    return null;
  }
}

const candidateFields = (c) => ({
  title: c.title, authors: c.authors, subtitle: c.subtitle ?? null, publisher: c.publisher ?? null,
  year: c.year ?? null, isbn: c.isbn ?? null, cover_url: c.cover_url ?? null, work_key: c.work_key ?? null,
});

function resultRow(candidate) {
  const thumb = el("div", { class: "thumb" });
  if (candidate.cover_url) {
    const img = el("img", { src: candidate.cover_url, alt: "", loading: "lazy", referrerpolicy: "no-referrer" });
    img.addEventListener("error", () => img.remove());
    thumb.append(img);
  }
  const byline = [candidate.authors.join(", "), candidate.year].filter(Boolean).join(" · ");
  const action = el("div", { class: "action" });
  const row = el("li", { class: "result" }, thumb,
    el("div", { class: "text" },
      el("div", { class: "t", dir: "auto", text: candidate.title }),
      el("div", { class: "meta", dir: "auto", text: byline })),
    action);

  if (candidate.in_library) {
    action.append(el("span", { class: "meta", text: "In library" }));
  } else {
    const button = el("button", { class: "btn", type: "button", text: "Add" });
    button.addEventListener("click", async () => {
      button.disabled = true;
      const book = await postBook(candidateFields(candidate), "search");
      if (!book) { button.disabled = false; return; }
      action.replaceChildren(el("span", { class: "meta", text: "Added ✓" }));
      toast(`Added: ${book.title}`);
      await load();
    });
    action.append(button);
  }
  return row;
}

function enterByHand(prefill = {}) {
  $("#manualTitle").value = prefill.title ?? "";
  $("#manualIsbn").value = prefill.isbn ?? "";
  setAddTab("manual");
  $("#manualTitle").focus();
}

$("#searchForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  const q = $("#addQuery").value.trim();
  if (!q) return;
  const button = $("#searchForm button");
  button.disabled = true;
  $("#addResults").replaceChildren();
  $("#addHint").textContent = "Searching…";
  try {
    const data = await api(`/search?q=${encodeURIComponent(q)}`);
    $("#addResults").replaceChildren(...data.results.map(resultRow));
    if (data.results.length) {
      $("#addHint").textContent = data.kind === "isbn" ? `Found by ISBN ${data.isbn}.` : `${data.results.length} results.`;
    } else {
      const message = data.kind === "isbn" ? `Open Library doesn’t know ISBN ${data.isbn}. ` : "No matches. Try fewer words, or ";
      const prefill = data.kind === "isbn" ? { isbn: data.isbn } : { title: q };
      $("#addHint").replaceChildren(message, el("button", {
        class: "link", type: "button", text: "enter it by hand", onclick: () => enterByHand(prefill),
      }), ".");
    }
  } catch (err) {
    $("#addHint").textContent = `Search failed: ${err.message}`;
  } finally {
    button.disabled = false;
  }
});

$("#manualForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  const year = $("#manualYear").value.trim();
  const book = await postBook({
    title: $("#manualTitle").value.trim(),
    authors: $("#manualAuthors").value.split("\n").map((s) => s.trim()).filter(Boolean),
    subtitle: $("#manualSubtitle").value.trim() || null,
    publisher: $("#manualPublisher").value.trim() || null,
    year: year === "" ? null : Number(year),
    isbn: $("#manualIsbn").value.trim() || null,
    cover_url: $("#manualCover").value.trim() || null,
  }, "manual");
  if (!book) return;
  event.target.reset();
  toast(`Added: ${book.title}`);
  await load();
  $("#manualTitle").focus(); // ready for the next one
});

$("#addBtn").addEventListener("click", openAdd);
$("#addTabSearch").addEventListener("click", () => setAddTab("search"));
$("#addTabManual").addEventListener("click", () => setAddTab("manual"));
$("#addClose").addEventListener("click", () => $("#addDialog").close());

// ---------------------------------------------------------------- search, sort, filters

function syncControls() {
  $("#search").value = view.q;
  $("#sort").value = view.sort;
  $("#minRating").value = String(view.minRating);
  $("#yearFrom").value = view.yearFrom;
  $("#yearTo").value = view.yearTo;
  $("#filters").open = activeFilterCount() > 0;
}

function applySearch(q) {
  if ($("#detailDialog").hasAttribute("open")) $("#detailDialog").close();
  view.q = q;
  $("#search").value = q;
  saveView();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

let searchTimer;
$("#search").addEventListener("input", (event) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { view.q = event.target.value; saveView(); render(); }, 120);
});
$("#sort").addEventListener("change", (event) => { view.sort = event.target.value; saveView(); render(); });
$("#minRating").addEventListener("change", (event) => { view.minRating = Number(event.target.value); saveView(); render(); });
for (const [selector, key] of [["#yearFrom", "yearFrom"], ["#yearTo", "yearTo"]]) {
  $(selector).addEventListener("input", (event) => { view[key] = event.target.value.trim(); saveView(); render(); });
}
$("#clearFilters").addEventListener("click", () => {
  Object.assign(view, { q: "", minRating: 0, yearFrom: "", yearTo: "" });
  syncControls();
  saveView();
  render();
});

syncControls();
load().catch((err) => toast(err.message, true));
</script>
</body>
</html>
